name: Wrong result or crash
description: A check gives a result you think is wrong, or proofmass-check stops with an error.
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Please attach results.json: it holds the versions and every number we need.
        Questions about installing Isaac Sim or Newton belong to NVIDIA's forums, not here.
  - type: dropdown
    id: engine
    attributes:
      label: Engine
      options: [physx, newton]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      render: shell
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: results.json
      description: Drag the file here, or paste it.
    validations:
      required: true
  - type: input
    id: asset
    attributes:
      label: Where can we get the asset?
      description: A link, if the asset is public. We never ask you to share a private asset.
