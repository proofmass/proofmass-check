# Builds the package for a version tag (v0.1.0) and publishes it to PyPI.
# Publishing uses PyPI Trusted Publishing, so there is no API token in the repository secrets.
# Before the first release, add this repository as a trusted publisher on PyPI
# (workflow "release.yml", environment "pypi").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      # The version comes from src/proofmass_check/__init__.py, not from the tag. PyPI refuses a
      # version it already has, so stop here when the tag and the code do not agree.
      - name: Check that the tag matches the version in the code
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/proofmass_check-${version}.tar.gz" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match the built package: $(ls dist | xargs)"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
