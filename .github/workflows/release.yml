# Builds the package for a version tag (v0.1.0) and publishes it to PyPI.
# Publishing uses PyPI Trusted Publishing, so there is no API token in the repository secrets.
# Before the first release, add this repository as a trusted publisher on PyPI
# (workflow "release.yml", environment "pypi").
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
